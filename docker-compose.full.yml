version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: local-ai-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-local_ai_gateway}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: local-ai-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Uncomment to use a GPU (requires nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  backend:
    build: ./backend
    container_name: local-ai-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-local_ai_gateway}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_DEFAULT_MODEL: ${OLLAMA_DEFAULT_MODEL:-qwen2.5:7b}
      CORS_ORIGINS: http://localhost:8081,http://localhost:5173
    ports:
      - "8080:8080"

  dashboard:
    image: nginx:alpine
    container_name: local-ai-dashboard
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  ollama_data:
